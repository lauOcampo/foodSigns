<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memoria de señas: comida</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#eaf2f4;--ink:#12303a;--card:#fff;--back:#1f6f78;--back2:#2a8b95;--hit:#f2b632;--ok:#2e9d5b;--mut:#4d6b74;--line:#b9cfd5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2228;--ink:#e6f1f3;--card:#f4f8f9;--back:#2a8b95;--back2:#3aa6b1;--mut:#9bb8bf;--line:#2c4a52}}
:root[data-theme="dark"]{--bg:#0f2228;--ink:#e6f1f3;--card:#f4f8f9;--back:#2a8b95;--back2:#3aa6b1;--mut:#9bb8bf;--line:#2c4a52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:18px;line-height:1.4}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(28px,5vw,42px);margin:0 0 4px;line-height:1.1}
p.sub{margin:0 0 18px;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--line)}
.levels{display:flex;gap:6px}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:700}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,.card:focus-visible{outline:4px solid var(--hit);outline-offset:2px}
.stats{margin-left:auto;display:flex;gap:16px;font-weight:700}
.stats span b{font-size:1.2em}
#grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.card{aspect-ratio:1/1.05;perspective:700px;border:0;padding:0;background:none;border-radius:14px}
.in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden}
.b{background:repeating-linear-gradient(45deg,var(--back),var(--back) 10px,var(--back2) 10px,var(--back2) 20px);font-size:44px;border:3px solid var(--ink)}
.f{transform:rotateY(180deg);background:var(--card);color:#12303a;border:3px solid #12303a;flex-direction:column}
.f img{width:100%;height:100%;object-fit:contain;display:block}
.f.w{font-size:clamp(18px,3.4vw,24px);font-weight:700;text-align:center;padding:6px}
.card.done .f{border-color:var(--ok);background:#e3f5ea}
.card.done .f.w{color:#14663a}
#win{display:none;margin-top:22px;padding:20px;border:3px solid var(--ok);border-radius:14px;text-align:center}
#win.show{display:block}
#win h2{margin:0 0 6px}
@media (prefers-reduced-motion:reduce){.in{transition:none}}
</style></head><body><main>
<h1>Memoria de señas: comida</h1>
<p class="sub">Une cada seña con su palabra. Toca dos cartas para voltearlas.</p>
<div class="bar">
 <div class="levels" role="group" aria-label="Dificultad">
  <button data-n="6" aria-pressed="false">Fácil</button>
  <button data-n="8" aria-pressed="true">Medio</button>
  <button data-n="12" aria-pressed="false">Difícil</button>
 </div>
 <button id="new">Nueva partida</button>
 <div class="stats" aria-live="polite"><span>Intentos <b id="mv">0</b></span><span>Parejas <b id="pr">0</b></span></div>
</div>
<div id="grid"></div>
<div id="win" role="status"><h2>¡Lo lograste!</h2><p id="wt"></p><button id="again">Jugar otra vez</button></div>
</main>

let n=8,first=null,lock=false,moves=0,pairs=0;
const $=s=>document.querySelector(s),grid=$("#grid");
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){
 first=null;lock=false;moves=0;pairs=0;$("#mv").textContent=0;$("#pr").textContent=0;$("#win").classList.remove("show");
 const pick=shuffle([...DATA]).slice(0,n);
 const cards=shuffle(pick.flatMap(d=>[{k:d.n,t:"i",d},{k:d.n,t:"w",d}]));
 grid.innerHTML="";
 cards.forEach(c=>{
  const el=document.createElement("button");el.className="card";el.dataset.k=c.k;
  el.setAttribute("aria-label","Carta boca abajo");
  el.innerHTML='<div class="in"><div class="b" aria-hidden="true">✋</div>'+
   (c.t==="i"?'<div class="f"><img alt="Seña de '+c.k+'" src="'+c.d.i+'"></div>':'<div class="f w">'+c.k+'</div>')+'</div>';
  el.addEventListener("click",()=>flip(el));grid.appendChild(el)});
}
function flip(el){
 if(lock||el.classList.contains("up")||el.classList.contains("done"))return;
 el.classList.add("up");
 if(!first){first=el;return}
 moves++;$("#mv").textContent=moves;
 const a=first;first=null;
 if(a.dataset.k===el.dataset.k){
  a.classList.replace("up","done");el.classList.replace("up","done");
  pairs++;$("#pr").textContent=pairs;
  if(pairs===n){$("#wt").textContent="Completaste "+n+" parejas en "+moves+" intentos.";$("#win").classList.add("show")}
 }else{lock=true;setTimeout(()=>{a.classList.remove("up");el.classList.remove("up");lock=false},1000)}
}
document.querySelectorAll(".levels button").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".levels button").forEach(x=>x.setAttribute("aria-pressed",x===b));n=+b.dataset.n;start()}));
$("#new").onclick=start;$("#again").onclick=start;start();
</script></body></html>
