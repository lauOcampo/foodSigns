<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identifica la seña | foodSigns</title>
    <link rel="stylesheet" href="../../assets/css/styleIdentificarSena.css">
    <script src="../../assets/js/vocabularyData.js" defer></script>
    <script src="../../assets/js/identificarSena.js" defer></script>
</head>
<body>
    <main class="game">
        <header class="game__header">
            <a class="game__back" href="../menu.html">← Volver al menú</a>
            <p class="game__eyebrow">foodSigns · Juego de vocabulario</p>
            <h1>¿Qué palabra corresponde a este video?</h1>
            <p>Lee la palabra y selecciona el video correcto.</p>
        </header>

        <section class="difficulty" aria-labelledby="difficulty-title">
            <h2 id="difficulty-title">Elige el nivel</h2>
            <div class="difficulty__options">
                <button class="difficulty__option is-selected" type="button" data-level="facil" aria-pressed="true">
                    <strong>Fácil</strong>
                    <span>3 opciones</span>
                </button>
                <button class="difficulty__option" type="button" data-level="medio" aria-pressed="false">
                    <strong>Medio</strong>
                    <span>6 opciones</span>
                </button>
                <button class="difficulty__option" type="button" data-level="dificil" aria-pressed="false">
                    <strong>Difícil</strong>
                    <span>10 opciones</span>
                </button>
            </div>
        </section>

        <section class="round" aria-label="Ronda actual">
            <div class="round__video-panel">
                <video id="sign-video" controls preload="metadata" playsinline aria-label="Video de la seña"></video>
                <p id="video-placeholder" class="round__placeholder">La palabra aparecerá aquí.</p>
            </div>
            <div class="round__answers">
                <div class="round__stats">
                    <span>Ronda <strong id="round-number">0</strong></span>
                    <span>Aciertos <strong id="score">0</strong></span>
                </div>
                <h2>¿Qué palabra es?</h2>
                <div id="answer-options" class="answer-options"></div>
                <p id="game-message" class="game__message" role="status" aria-live="polite">
                    Elige un nivel y comienza una partida.
                </p>
                <button id="new-game" class="game__start" type="button">Iniciar partida</button>
                <button id="next-round" class="game__next" type="button" hidden>Siguiente seña</button>
            </div>
        </section>
    </main>
</body>
</html>
